name: CI - Build notebooks and deploy to Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert nbformat jupyter pandas duckdb scikit-learn matplotlib

      - name: Execute notebooks and convert to HTML
        run: |
          mkdir -p docs
          for nb in notebooks/*.ipynb; do
            echo "Processing $nb"
            jupyter nbconvert --to html --execute "$nb" --output "docs/$(basename "$nb" .ipynb).html" --ExecutePreprocessor.timeout=600
          done

      - name: Create simple index
        run: |
          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>FlyRank — Ranking Signal Analysis</title>
            </head>
            <body>
              <h1>FlyRank — Ranking Signal Analysis</h1>
              <p>Generated notebooks:</p>
              <ul>
              <!-- LINKS -->
              </ul>
            </body>
          </html>
          HTML
          for f in docs/*.html; do
            fname=$(basename "$f")
            if [ "$fname" != "index.html" ]; then
              sed -i "/<!-- LINKS -->/a <li><a href=\"$fname\">$fname</a></li>" docs/index.html
            fi
          done

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
